<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Meriem 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffe6e6, #fff5cc);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      width: 650px;
      position: relative;
    }

    .sticker-placeholder {
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    .buttons {
      margin-top: 30px;
      position: relative;
      height: 120px;
    }

    button {
      padding: 14px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yesBtn {
      background: #ff6b81;
      color: white;
      margin-right: 10px;
      font-size: 22px;
      padding: 18px 40px;
    }

    #yesBtn:hover {
      transform: scale(1.1);
    }

    #noBtn {
      background: #ccc;
      position: absolute;
      left: 180px;
      top: 0;
    }

    #subtext {
      color: #333333;
      margin-top: 15px;
    }

    .result {
      display: none;
    }

    .result img {
      width: 200px;
      margin-top: 20px;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: float 3s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-150px); opacity: 0; }
    }

    /* ====== MOBILE RESPONSIVE ====== */
    @media (max-width: 768px) {
      .container {
        width: 90%;
        padding: 30px;
      }

      h1 {
        font-size: 20px;
      }

      #yesBtn {
        font-size: 20px;
        padding: 16px 30px;
      }

      #noBtn {
        left: 120px;
      }

      .result img {
        width: 150px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 18px;
      }

      #yesBtn {
        font-size: 18px;
        padding: 14px 28px;
      }

      #noBtn {
        left: 100px;
      }

      .result img {
        width: 120px;
      }
    }
  </style>
</head>

<body>

  <div class="container" id="card">
    <div class="sticker-placeholder">
      <img src="./assets/heart.png" alt="heart">
    </div>

    <h1>Meriem will you bee my Valentine ?</h1>

    <div class="buttons">
      <button id="yesBtn">Yes ❤️‍🔥</button>
      <button id="noBtn">No 🙄</button>
    </div>

    <div class="result" id="result">
      <h2>YAAAY!! 🥹💞</h2>
      <p>You just made my heart very happy 💕</p>
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZWF6aG05bHBqOGM0enR5cnMwNTF1YWlnZXl2ZHB0Y3I0eDlvcjdrNyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/Zl7u48zLVFgLpRwq6f/giphy.gif" alt="cute gif">
    </div>

    <div id="subtext">
      "No" seems abit shy hehe 😈
    </div>
  </div>

  <!-- 🎵 LOVE SONG -->
  <audio id="loveSong" src="./assets/love-song.mp3"></audio>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const result = document.getElementById('result');
    const song = document.getElementById('loveSong');

    noBtn.addEventListener('mouseenter', () => {
      const x = Math.random() * 350 + 200;
      const y = Math.random() * 300;
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    yesBtn.addEventListener('click', () => {
      document.querySelector('.buttons').style.display = 'none';
      result.style.display = 'block';
      document.getElementById('subtext').style.display = 'none';

      song.volume = 0.6;
      song.play();

      createHearts();
    });

    function createHearts() {
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerText = '💖';
        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.bottom = '0px';
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 3000);
      }
    }
  </script>

</body>
</html>
